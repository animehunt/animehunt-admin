<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login – AnimeHunt CMS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{\n  background:#0b0f1a;color:#fff;\n  min-height:100vh;display:flex;align-items:center;justify-content:center;\n  background-image:radial-gradient(ellipse at 20% 50%,rgba(255,204,0,.05) 0%,transparent 60%),\n                   radial-gradient(ellipse at 80% 20%,rgba(255,204,0,.03) 0%,transparent 50%)\n}
.login-box{\n  width:100%;max-width:380px;\n  background:#0e1424;border:1px solid #1a2035;border-radius:16px;\n  padding:36px 32px;box-shadow:0 24px 60px rgba(0,0,0,.5)\n}
.brand{text-align:center;margin-bottom:28px}
.brand h1{font-size:26px;font-weight:800}
.brand h1 b{color:#ffcc00}
.brand p{font-size:12px;color:#555;margin-top:6px}
.form-group{margin-bottom:16px}
.form-label{font-size:11px;color:#777;margin-bottom:6px;display:block;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.form-input{\n  width:100%;background:#0b0f1a;border:1px solid #1a2035;color:#fff;\n  padding:11px 14px;border-radius:8px;font-size:13px;outline:none;transition:.2s\n}
.form-input:focus{border-color:#ffcc00}
.form-input::placeholder{color:#333}
.login-btn{\n  width:100%;background:#ffcc00;border:none;color:#000;\n  padding:12px;border-radius:8px;font-size:14px;font-weight:700;\n  cursor:pointer;margin-top:8px;transition:.2s\n}
.login-btn:hover{background:#ffd633;transform:translateY(-1px)}
.login-btn:disabled{opacity:.5;cursor:default;transform:none}
.error-msg{\n  background:#220d0d;border:1px solid #f44336;color:#f44336;\n  padding:10px 14px;border-radius:7px;font-size:12px;margin-top:12px;\n  display:none\n}
.error-msg.show{display:block}
</style>
</head>
<body>

<div class="login-box">
  <div class="brand">
    <h1>Anime<b>Hunt</b></h1>
    <p>Admin CMS — Sign in to continue</p>
  </div>

  <div class="form-group">
    <label class="form-label">Username</label>
    <input class="form-input" id="username" type="text" placeholder="Enter username" autocomplete="username">
  </div>

  <div class="form-group">
    <label class="form-label">Password</label>
    <input class="form-input" id="password" type="password" placeholder="Enter password" autocomplete="current-password">
  </div>

  <button class="login-btn" id="loginBtn">Sign In</button>

  <div class="error-msg" id="errorMsg"></div>
</div>

<script>
// ✅ FIXED: Ab ye seedhe bina middleware block ke /api/auth par hit karega
const API = "https://animehunt-backend.animehunt715.workers.dev/api/auth"

/* If already logged in, redirect */
if (localStorage.getItem("ah_token")) {
  window.location.href = "dashboard.html"
}

async function doLogin() {
  const username = document.getElementById("username").value.trim()
  const password = document.getElementById("password").value.trim()
  const btn      = document.getElementById("loginBtn")
  const errEl    = document.getElementById("errorMsg")

  if (!username || !password) {
    errEl.textContent = "Please enter username and password"
    errEl.classList.add("show")
    return
  }

  btn.disabled    = true
  btn.textContent = "Signing in..."
  errEl.classList.remove("show")

  try {
    const res  = await fetch(`${API}/login`, {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ username, password })
    })
    
    if (!res.ok) {
      const errJson = await res.json().catch(() => ({}))
      throw new Error(errJson.message || `Server returned status ${res.status}`)
    }

    const json = await res.json()

    if (!json.success) throw new Error(json.message || "Invalid credentials")

    // Token save karo aur dashboard pe bhejo
    localStorage.setItem("ah_token",    json.data.token)
    localStorage.setItem("ah_username", json.data.username)

    window.location.href = "dashboard.html"

  } catch (err) {
    errEl.textContent = err.message
    errEl.classList.add("show")
  } finally {
    btn.disabled    = false
    btn.textContent = "Sign In"
  }
}

document.getElementById("loginBtn").onclick = doLogin

/* Enter key support */
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") doLogin()
})
</script>
</body>
</html>
