<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnimeHunt — Admin Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #0d0d0d;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .box {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 40px 36px;
      width: 360px;
    }

    .logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo h1 {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
    }

    .logo h1 span { color: #f5c518; }

    .logo p {
      color: #666;
      font-size: 13px;
      margin-top: 4px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 11px 14px;
      color: #fff;
      font-size: 14px;
      margin-bottom: 16px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus { border-color: #f5c518; }

    .pw-wrap {
      position: relative;
    }

    .pw-wrap input { padding-right: 42px; }

    .pw-wrap button {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-60%);
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 16px;
      padding: 0;
    }

    .btn {
      width: 100%;
      background: #f5c518;
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.2s;
    }

    .btn:hover   { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error {
      display: none;
      background: #2a1a1a;
      border: 1px solid #c0392b;
      color: #e74c3c;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 14px;
      text-align: center;
    }

    .error.show { display: block; }
  </style>
</head>
<body>

<div class="box">
  <div class="logo">
    <h1>Anime<span>Hunt</span></h1>
    <p>Admin CMS — Sign in to continue</p>
  </div>

  <label>Username</label>
  <input type="text" id="username" placeholder="Enter username" autocomplete="off">

  <label>Password</label>
  <div class="pw-wrap">
    <input type="password" id="password" placeholder="Enter password">
    <button type="button" id="eyeBtn">👁</button>
  </div>

  <button class="btn" id="loginBtn">Sign In</button>
  <div class="error" id="errMsg">Invalid credentials</div>
</div>

<script>
  const API = "https://animehunt-backend.animehunt715.workers.dev/api/auth/login"

  // Eye toggle
  document.getElementById("eyeBtn").onclick = () => {
    const pw = document.getElementById("password")
    pw.type = pw.type === "password" ? "text" : "password"
  }

  // Login
  async function doLogin() {
    const username = document.getElementById("username").value.trim()
    const password = document.getElementById("password").value
    const btn      = document.getElementById("loginBtn")
    const err      = document.getElementById("errMsg")

    err.classList.remove("show")

    if (!username || !password) {
      err.textContent = "Please enter username and password"
      err.classList.add("show")
      return
    }

    btn.disabled    = true
    btn.textContent = "Signing in..."

    try {
      const res  = await fetch(API, {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ username, password })
      })

      const data = await res.json()

      if (data.success) {
        localStorage.setItem("ah_token",    data.data.token)
        localStorage.setItem("ah_username", data.data.username)
        window.location.href = "index.html"
      } else {
        err.textContent = data.message || "Invalid credentials"
        err.classList.add("show")
        btn.disabled    = false
        btn.textContent = "Sign In"
      }

    } catch {
      err.textContent = "Connection error. Try again."
      err.classList.add("show")
      btn.disabled    = false
      btn.textContent = "Sign In"
    }
  }

  document.getElementById("loginBtn").onclick = doLogin
  document.addEventListener("keydown", e => {
    if (e.key === "Enter") doLogin()
  })
</script>

</body>
</html>
